<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDML</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --primary: #8224d4;
            --text: #ffffff;
            --error: #ff4757;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            /* Çok hafif bir arkada mor ışık */
            background-image: radial-gradient(circle at 50% 50%, rgba(130, 36, 212, 0.1), transparent 60%);
        }

        .center-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        .logo {
            font-size: 6rem;
            font-weight: 900;
            letter-spacing: -2px;
            background: linear-gradient(180deg, #ffffff 0%, #a0a0a0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            line-height: 1;
        }

        /* Yükleniyor çubuğu (KDML'nin altında ince bir çizgi) */
        .loader-bar {
            width: 0%;
            height: 3px;
            background: var(--primary);
            margin-top: 20px;
            border-radius: 4px;
            box-shadow: 0 0 10px var(--primary);
            transition: width 0.3s ease;
            animation: load 2s forwards cubic-bezier(0.1, 0.8, 0.2, 1);
        }

        /* Hata Mesajı Alanı */
        .error-msg {
            color: var(--error);
            font-size: 13px;
            margin-top: 15px;
            font-weight: 600;
            opacity: 0;
            transform: translateY(-5px);
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }

        .error-msg.show {
            opacity: 1;
            transform: translateY(0);
        }

        @keyframes load {
            0% { width: 0%; opacity: 1; }
            70% { width: 100%; opacity: 1; }
            100% { width: 100%; opacity: 0; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="center-box">
        <!-- Sadece KDML -->
        <h1 class="logo">KDML</h1>
        
        <!-- Yükleniyor Çubuğu -->
        <div class="loader-bar" id="loaderBar"></div>
        
        <!-- Hata Mesajı -->
        <div class="error-msg" id="errorMsg">Missing Job ID.</div>
    </div>

    <script>
        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            const pid = params.get('pid') || '142823291';
            const jid = params.get('jid');
            const errorMsg = document.getElementById('errorMsg');
            const loaderBar = document.getElementById('loaderBar');

            // Eğer JID yoksa
            if (!jid || jid.trim() === "") {
                // Animasyonu durdur
                loaderBar.style.display = 'none';
                // Hatayı göster
                errorMsg.innerText = "Missing Job ID.";
                errorMsg.classList.add('show');
                return;
            }

            const protocolLink = `roblox://experiences/start?placeId=${pid}&gameInstanceId=${jid}`;
            const webLink = `https://www.roblox.com/games/${pid}?join=${jid}`;

            // Roblox'u açmayı dene
            try {
                window.location.href = protocolLink;
            } catch (e) {
                // Protokol desteklenmiyorsa hata ver (Genelde tarayıcılar hata fırlatmaz ama)
            }

            // 2 saniye sonra hala sayfadaysa (uygulama açılmadıysa) hatayı göster
            setTimeout(() => {
                if (document.visibilityState === 'visible') {
                    loaderBar.style.display = 'none';
                    errorMsg.innerText = "Failed to open Roblox. Please try again.";
                    errorMsg.classList.add('show');
                    
                    // Otomatik web linkini açma, kullanıcıya bırak
                }
            }, 2500);
        };
    </script>
</body>
</html>
