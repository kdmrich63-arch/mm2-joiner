<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MM2 Joiner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background: #0d0d1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
        }
        .container {
            background: #1a1a2e;
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 0 50px rgba(233, 69, 96, 0.2);
            max-width: 450px;
            width: 100%;
        }
        h1 {
            font-size: 32px;
            color: #e94560;
            margin-bottom: 10px;
        }
        p {
            color: #888;
            margin-bottom: 25px;
        }
        .status {
            padding: 12px;
            border-radius: 10px;
            background: #0f3460;
            color: #4fc3f7;
            margin-top: 20px;
        }
        .spinner {
            border: 4px solid #0f3460;
            border-top: 4px solid #e94560;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #444;
        }
        .jobid-info {
            background: #0f3460;
            padding: 10px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 13px;
            color: #4fc3f7;
            word-break: break-all;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 MM2 Joiner</h1>
        <p>Sunucuya bağlanılıyor...</p>
        <div class="spinner"></div>
        <div class="status" id="status">🔄 Roblox açılıyor...</div>
        <div class="jobid-info" id="jobidDisplay">JobID: -</div>
        <div class="footer">Private Joiner v2.0</div>
    </div>

    <script>
        // Sayfa yüklenir yüklenmez çalışır
        (function() {
            const status = document.getElementById('status');
            const jobidDisplay = document.getElementById('jobidDisplay');

            // URL'den JobID'yi al
            const urlParams = new URLSearchParams(window.location.search);
            const jobId = urlParams.get('jobid');

            if (!jobId) {
                status.textContent = '❌ HATA: JobID bulunamadı!';
                jobidDisplay.textContent = 'JobID: -';
                return;
            }

            jobidDisplay.textContent = 'JobID: ' + jobId;

            // 0.5 saniye bekle (kullanıcı sayfayı görsün)
            setTimeout(function() {
                status.textContent = '🔄 Roblox açılıyor...';

                // YÖNTEM 1: roblox:// protokolü (en iyisi)
                const robloxProtocol = 'roblox://placeId=142823291&joinId=' + jobId;
                
                // YÖNTEM 2: normal link (protokol çalışmazsa)
                const robloxUrl = 'https://www.roblox.com/games/142823291?join=' + jobId;

                // Önce roblox:// dene
                try {
                    window.location.href = robloxProtocol;
                    status.textContent = '✅ Roblox açıldı!';
                } catch (e) {
                    // Çalışmazsa normal linke yönlendir
                    window.location.href = robloxUrl;
                    status.textContent = '✅ Roblox açıldı!';
                }

                // 3 saniye sonra hala açılmadıysa normal linke yönlendir
                setTimeout(function() {
                    status.textContent = '⏳ Roblox açılmıyor mu? Manuel tıkla...';
                    // Kullanıcıya manuel link göster (ama burada gizli)
                    // window.location.href = robloxUrl;
                }, 3000);

            }, 500);

        })();
    </script>
</body>
</html>
