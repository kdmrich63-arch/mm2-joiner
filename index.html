<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDML</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --text: #ffffff;
            --primary: #8224d4;
            --primary-hover: #9d3ef5;
            --error: #ff3333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        .logo {
            font-size: 4.5rem;
            font-weight: 900;
            letter-spacing: -2px;
            background: linear-gradient(180deg, #ffffff 0%, #b39ddb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
            animation: fadeIn 0.8s ease-out;
        }

        .job-id {
            font-size: 12px;
            color: #555555;
            font-family: monospace;
            margin-bottom: 40px;
            word-break: break-all;
            padding: 6px 12px;
            background: #111;
            border-radius: 6px;
            animation: fadeIn 1s ease-out;
        }

        .btn {
            background: var(--primary);
            color: #ffffff;
            border: none;
            padding: 18px 32px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            animation: fadeIn 1.2s ease-out;
            box-shadow: 0 4px 15px rgba(130, 36, 212, 0.4);
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(130, 36, 212, 0.6);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Hata Ekranı */
        .error-container {
            display: none;
            flex-direction: column;
            align-items: center;
            animation: shake 0.5s;
        }

        .error-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .error-text {
            font-size: 16px;
            color: var(--error);
            font-weight: 700;
            text-align: center;
            line-height: 1.5;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- KDML Logosu -->
        <div class="logo">KDML</div>

        <!-- Ana İçerik (Buton ve JobID) -->
        <div id="mainArea" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
            <div class="job-id" id="jobIdText">JobID: -</div>
            <button class="btn" onclick="joinGame()">Sunucuya Katıl</button>
        </div>

        <!-- Hata Ekranı -->
        <div class="error-container" id="errorArea">
            <div class="error-icon">⚠️</div>
            <div class="error-text" id="errorText">Error</div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const pid = params.get('pid') || '142823291';
        const jid = params.get('jid');

        const mainArea = document.getElementById('mainArea');
        const errorArea = document.getElementById('errorArea');
        const errorText = document.getElementById('errorText');
        const jobIdText = document.getElementById('jobIdText');

        // Linkler
        const protocolLink = `roblox://experiences/start?placeId=${pid}&gameInstanceId=${jid}`;
        const webLink = `https://www.roblox.com/games/${pid}?join=${jid}`;

        // Sayfa yüklendiğinde sadece kontrol yap, otomatik yönlendirme YAPMA
        window.onload = function() {
            if (!jid || jid.trim() === "") {
                mainArea.style.display = 'none';
                errorArea.style.display = 'flex';
                errorText.innerText = "Geçersiz Link\nJobID parametresi bulunamadı.";
                return;
            }

            jobIdText.innerText = `JobID: ${jid}`;
        };

        // Butona tıklandığında çalışır
        function joinGame() {
            // Roblox uygulamasını açmayı dene
            window.location.href = protocolLink;

            // Eğer uygulama açılmazsa 2 saniye sonra web tarayıcısına yönlendir (yedek)
            setTimeout(() => {
                window.open(webLink, '_blank');
            }, 2000);
        }
    </script>
</body>
</html>
