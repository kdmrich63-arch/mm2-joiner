<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDML</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --text: #ffffff;
            --primary: #8224d4;
            --error: #ff3333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        /* KDML Logosu */
        .logo {
            font-size: 4.5rem;
            font-weight: 900;
            letter-spacing: -2px;
            background: linear-gradient(180deg, #ffffff 0%, #b39ddb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            animation: fadeIn 1s ease-out;
        }

        /* Durum Yazısı ve Yüklenici */
        .status-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top: 2px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .status-text {
            font-size: 15px;
            font-weight: 700;
            color: #aaaaaa;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .job-id {
            font-size: 12px;
            color: #555555;
            font-family: monospace;
            margin-bottom: 30px;
            word-break: break-all;
            padding: 5px 10px;
            background: #111;
            border-radius: 5px;
        }

        /* Butonlar */
        .btn {
            background: #151515;
            color: #ffffff;
            border: 1px solid #333;
            padding: 16px 32px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            display: none;
        }

        .btn:hover {
            background: #222;
            border-color: var(--primary);
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* Hata Ekranı */
        .error-container {
            display: none;
            flex-direction: column;
            align-items: center;
            animation: shake 0.5s;
        }

        .error-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .error-text {
            font-size: 16px;
            color: var(--error);
            font-weight: 700;
            text-align: center;
            line-height: 1.5;
        }

        /* Animasyonlar */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- KDML Yazısı (Her zaman görünür) -->
        <div class="logo">KDML</div>

        <!-- Yükleniyor Durumu -->
        <div id="loadingArea">
            <div class="status-container">
                <div class="spinner"></div>
                <div class="status-text">Connecting</div>
            </div>
            <div class="job-id" id="jobIdText"></div>
            <button class="btn" id="joinBtn" onclick="joinGame()">Open Roblox</button>
        </div>

        <!-- Hata Durumu -->
        <div class="error-container" id="errorArea">
            <div class="error-icon">⚠️</div>
            <div class="error-text" id="errorText">Error</div>
        </div>

    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const pid = params.get('pid') || '142823291';
        const jid = params.get('jid');

        const loadingArea = document.getElementById('loadingArea');
        const errorArea = document.getElementById('errorArea');
        const errorText = document.getElementById('errorText');
        const jobIdText = document.getElementById('jobIdText');
        const joinBtn = document.getElementById('joinBtn');

        // Linkleri hazırla
        const protocolLink = `roblox://experiences/start?placeId=${pid}&gameInstanceId=${jid}`;
        const webLink = `https://www.roblox.com/games/${pid}?join=${jid}`;

        function showError(msg) {
            loadingArea.style.display = 'none';
            errorArea.style.display = 'flex';
            errorText.innerText = msg;
        }

        function joinGame() {
            window.location.href = protocolLink;
            setTimeout(() => {
                window.open(webLink, '_blank');
            }, 1500);
        }

        window.onload = function() {
            // 1. Önce JobID var mı kontrol et
            if (!jid || jid.trim() === "") {
                showError("Missing JobID parameter.\nPlease use a valid link.");
                return;
            }

            // 2. JobID'yi ekrana yaz
            jobIdText.innerText = `JobID: ${jid}`;

            // 3. Otomatik açmayı dene
            try {
                window.location.href = protocolLink;
                
                // 2 Saniye içinde açılmazsa butonu göster
                setTimeout(() => {
                    if (document.visibilityState === 'visible') {
                        joinBtn.style.display = 'block';
                    }
                }, 2000);

            } catch (e) {
                // Tarayıcı engellediyse direkt butonu göster
                joinBtn.style.display = 'block';
            }
        };
    </script>
</body>
  </html>
