<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MM2 Joiner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background: #0d0d1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
        }
        .container {
            background: #1a1a2e;
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 0 50px rgba(233, 69, 96, 0.2);
            max-width: 450px;
            width: 100%;
        }
        h1 {
            font-size: 32px;
            color: #e94560;
            margin-bottom: 10px;
        }
        p {
            color: #888;
            margin-bottom: 25px;
        }
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: #e94560;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn:hover {
            background: #c73652;
            transform: scale(1.03);
        }
        .btn:active {
            transform: scale(0.97);
        }
        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 10px;
            background: #0f3460;
            color: #4fc3f7;
            display: none;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #444;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 MM2 Joiner</h1>
        <p>Otomatik sunucuya bağlan</p>
        <button class="btn" onclick="join()">🚀 SUNUCUYA GİR</button>
        <div class="status" id="status">🔄 Bağlanılıyor...</div>
        <div class="footer">Private Joiner v1.0</div>
    </div>

    <script>
        function join() {
            const status = document.getElementById('status');
            status.style.display = 'block';
            status.textContent = '🔄 Roblox açılıyor...';

            // URL'den JobID'yi al (örnek: site.com/?jobid=XXXX)
            const urlParams = new URLSearchParams(window.location.search);
            const jobId = urlParams.get('jobid');

            if (!jobId) {
                status.textContent = '❌ HATA: JobID bulunamadı!';
                return;
            }

            // Roblox linki burada gizli, kullanıcı görmüyor
            const robloxUrl = 'https://www.roblox.com/games/142823291?join=' + jobId;

            // Yeni sekmede aç (kullanıcı Roblox linkini görebilir ama adres çubuğunda)
            // Bunu önlemek için window.location.href kullan
            window.location.href = robloxUrl;

            status.textContent = '✅ Roblox açıldı!';
        }

        // Sayfa yüklendiğinde otomatik join yap (isteğe bağlı)
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const jobId = urlParams.get('jobid');
            if (jobId) {
                setTimeout(() => {
                    join();
                }, 500);
            }
        };
    </script>
</body>
</html>
