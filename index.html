<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MM2 Joiner</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body {
            background: #0d0d1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
        }
        .container {
            background: #1a1a2e;
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 0 50px rgba(233, 69, 96, 0.15);
        }
        h1 { font-size: 32px; color: #e94560; margin-bottom: 8px; }
        .sub { color: #888; font-size: 14px; margin-bottom: 25px; }
        .jobid-box {
            background: #0f3460;
            padding: 12px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 13px;
            color: #4fc3f7;
            word-break: break-all;
            margin-bottom: 25px;
        }
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 12px;
        }
        .btn-primary {
            background: #e94560;
            color: #fff;
        }
        .btn-primary:hover {
            background: #c73652;
            transform: scale(1.02);
        }
        .btn-secondary {
            background: #0f3460;
            color: #4fc3f7;
        }
        .btn-secondary:hover {
            background: #1a4a7a;
        }
        .status {
            padding: 10px;
            border-radius: 8px;
            background: #0f3460;
            color: #4fc3f7;
            margin-top: 15px;
            font-size: 14px;
        }
        .footer { margin-top: 20px; font-size: 12px; color: #444; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 MM2 Joiner</h1>
        <p class="sub">Sunucuya bağlanmak için tıkla</p>

        <div class="jobid-box" id="jobidDisplay">JobID: -</div>

        <button class="btn btn-primary" onclick="openRoblox()">🚀 ROBLOX'U AÇ</button>
        <button class="btn btn-secondary" onclick="openRobloxFallback()">⬅️ Roblox açılmıyorsa tıkla</button>

        <div class="status" id="status">⏳ Hazır</div>
        <div class="footer">Private Joiner v3.0</div>
    </div>

    <script>
        let currentJobId = '';

        function getJobId() {
            const urlParams = new URLSearchParams(window.location.search);
            const jobId = urlParams.get('jobid');
            if (jobId) {
                currentJobId = jobId;
                document.getElementById('jobidDisplay').textContent = 'JobID: ' + jobId;
                document.getElementById('status').textContent = '✅ JobID alındı, sunucuya bağlanmaya hazır';
                return jobId;
            } else {
                document.getElementById('status').textContent = '❌ HATA: JobID bulunamadı!';
                return null;
            }
        }

        function openRoblox() {
            const jobId = getJobId();
            if (!jobId) return;

            const status = document.getElementById('status');
            status.textContent = '🔄 Roblox açılıyor...';

            // YÖNTEM 1: roblox:// protokolü
            const robloxProtocol = 'roblox://placeId=142823291&joinId=' + jobId;

            try {
                window.location.href = robloxProtocol;
                status.textContent = '✅ Roblox açıldı! (Eğer açılmadıysa alttaki butonu dene)';
            } catch (e) {
                status.textContent = '⚠️ Roblox açılamadı, alternatif yöntem deneniyor...';
                openRobloxFallback();
            }
        }

        function openRobloxFallback() {
            const jobId = getJobId();
            if (!jobId) return;

            const status = document.getElementById('status');
            status.textContent = '🔄 Alternatif yöntem ile açılıyor...';

            // YÖNTEM 2: Normal Roblox linki
            const robloxUrl = 'https://www.roblox.com/games/142823291?join=' + jobId;

            // Yeni sekmede aç
            window.open(robloxUrl, '_blank');
            status.textContent = '✅ Roblox yeni sekmede açıldı! (Eğer açılmadıysa linki manuel kopyala)';
        }

        // Sayfa yüklendiğinde otomatik dene (isteğe bağlı)
        window.onload = function() {
            const jobId = getJobId();
            if (jobId) {
                // 1 saniye bekle, sonra otomatik dene
                setTimeout(function() {
                    // Sadece bilgi ver, kullanıcı butona tıklasın
                    document.getElementById('status').textContent = '✅ Roblox'u açmak için butona tıkla';
                }, 1000);
            }
        };
    </script>
</body>
</html>
