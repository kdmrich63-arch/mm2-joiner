<!DOCTYPE html>
<html>
<head>
    <title>Kdml Joiner</title>
    <style>
        body { 
            background: #000; 
            color: #8224d4; 
            font-family: sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            flex-direction: column; 
            margin: 0;
        }
        .loader { 
            border: 4px solid #1a1a1a; 
            border-top: 4px solid #8224d4; 
            border-radius: 50%; 
            width: 40px; 
            height: 40px; 
            animation: spin 1s linear infinite; 
        }
        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }
        .btn {
            padding: 15px 40px;
            background: #8224d4;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
        }
        .btn:hover {
            background: #6a1ca8;
            transform: scale(1.05);
        }
        .info {
            color: #555;
            font-size: 14px;
            margin-top: 10px;
            word-break: break-all;
            text-align: center;
            max-width: 400px;
        }
        .status {
            color: #4fc3f7;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="loader" id="loader"></div>
    <h2 id="msg">Starting Roblox...</h2>
    <div class="info" id="jobidInfo">JobID: -</div>
    <div class="status" id="statusMsg">⏳ Bağlanılıyor...</div>

    <script>
        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            const pid = params.get('pid') || '142823291';  // MM2 place ID sabit
            const jid = params.get('jid');  // JobID

            const statusMsg = document.getElementById('statusMsg');
            const jobidInfo = document.getElementById('jobidInfo');

            if (!jid) {
                document.getElementById('msg').innerText = "❌ HATA: JobID (jid) parametresi eksik!";
                document.getElementById('loader').style.display = 'none';
                statusMsg.innerText = "❌ Linkte ?jid=XXXX eklenmeli";
                return;
            }

            jobidInfo.innerText = 'JobID: ' + jid;

            // Roblox protokol linki (güncel format)
            const protocolLink = "roblox://experiences/start?placeId=" + pid + "&gameInstanceId=" + jid;
            // Eski format (yedek)
            const protocolLinkOld = "roblox://placeId=" + pid + "&joinId=" + jid;
            // Normal web linki (yedek)
            const webLink = "https://www.roblox.com/games/" + pid + "?join=" + jid;

            // Önce roblox:// dene
            try {
                window.location.href = protocolLink;
                statusMsg.innerText = '✅ Roblox açılıyor...';
                document.getElementById('msg').innerText = '✅ Roblox açılıyor...';
                document.getElementById('loader').style.display = 'none';
            } catch (e) {
                statusMsg.innerText = '⚠️ Roblox protokolü çalışmadı, butona tıkla.';
                document.getElementById('loader').style.display = 'none';
                document.getElementById('msg').innerHTML = 
                    '<button class="btn" onclick="openRoblox()">🎮 Roblox\'u Aç</button>' +
                    '<br><br>' +
                    '<button class="btn" style="background:#333;" onclick="openWeb()">🌐 Web\'den Aç (yedek)</button>';
            }

            // 3 saniye sonra hala açılmadıysa buton göster
            setTimeout(function() {
                if (document.getElementById('msg').innerText.includes('Roblox açılıyor')) {
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('msg').innerHTML = 
                        '<button class="btn" onclick="openRoblox()">🎮 Roblox\'u Aç</button>' +
                        '<br><br>' +
                        '<button class="btn" style="background:#333;" onclick="openWeb()">🌐 Web\'den Aç (yedek)</button>';
                    statusMsg.innerText = '⏳ Roblox açılmadıysa butona tıkla';
                }
            }, 3000);

            // Global fonksiyonlar (butonlar için)
            window.openRoblox = function() {
                try {
                    window.location.href = protocolLink;
                    statusMsg.innerText = '✅ Roblox açılıyor...';
                } catch (e) {
                    window.open(webLink, '_blank');
                    statusMsg.innerText = '✅ Web linki yeni sekmede açıldı';
                }
            };

            window.openWeb = function() {
                window.open(webLink, '_blank');
                statusMsg.innerText = '✅ Web linki yeni sekmede açıldı';
            };
        };
    </script>
</body>
</html>
